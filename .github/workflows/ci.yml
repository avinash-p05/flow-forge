name: FlowForge CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Start dependencies
        working-directory: .
        run: docker compose up -d --wait postgres redis
      - name: Start API for health check
        run: |
          AUTH_TOKEN_SECRET=ci-secret-with-at-least-32-characters \
          AUTH_ACCESS_TOKEN_TTL_SECONDS=900 \
          AUTH_REFRESH_TOKEN_TTL_SECONDS=604800 \
          DATABASE_URL=postgresql://flowforge:flowforge@127.0.0.1:5433/flowforge \
          REDIS_URL=redis://127.0.0.1:6379 \
          node --loader ts-node/esm src/server.ts > /tmp/flowforge-api.log 2>&1 &
          for attempt in {1..10}; do
            curl --fail http://127.0.0.1:3000/health && break
            sleep 1
          done
      - run: npm run smoke
        env:
          API_URL: http://127.0.0.1:3000
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose config

  build-images:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f server/Dockerfile.api -t flowforge-api:${{ github.sha }} server
      - name: Build worker image
        run: docker build -f server/Dockerfile.worker -t flowforge-worker:${{ github.sha }} server
