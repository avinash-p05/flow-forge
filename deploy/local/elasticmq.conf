# Local SQS (ElasticMQ). Mirrors the AWS setup: a main queue with a redrive policy
# that moves a message to the dead-letter queue after 5 failed receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

queues {
  flowforge-executions-dlq {}
  flowforge-executions {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "flowforge-executions-dlq"
      maxReceiveCount = 5
    }
  }
}
